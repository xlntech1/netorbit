name: Validate

on:
  # Push only on main, as in e2e.yml: a branch with a PR already runs on pull_request, and its push run
  # can't use the PR's browser cache, so it reinstalled WebKit from a slow mirror and timed out.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - name: Install the conversation packages Home Assistant pins (used by the AI tool tests)
        run: |
          # Read the manifest as a file: importing the conversation package needs these very requirements.
          pip install $(python -c "import json, pathlib, importlib.util; root = pathlib.Path(importlib.util.find_spec('homeassistant').origin).parent; print(' '.join(json.loads((root / 'components' / 'conversation' / 'manifest.json').read_text())['requirements']))")
      - run: pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test tests/card.test.js

  tools-on-current-ha:
    name: Assistant tools on Home Assistant 2026.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the test harness release that pins Home Assistant 2026.10 (the unit-test job gets 2026.2 on Python 3.13)
        run: pip install "pytest-homeassistant-custom-component==0.13.375" "icmplib>=3.0.3" "pysnmp>=7.1" "aiooui>=0.1.9"
      - name: Install the conversation packages Home Assistant pins (used by the AI tool tests)
        run: |
          pip install $(python -c "import json, pathlib, importlib.util; root = pathlib.Path(importlib.util.find_spec('homeassistant').origin).parent; print(' '.join(json.loads((root / 'components' / 'conversation' / 'manifest.json').read_text())['requirements']))")
      - run: pytest -q tests/test_auto_and_tools.py

  browser:
    name: Browser tests (${{ matrix.browser }})
    # Pinned: Playwright downloads a WebKit build for the host's Ubuntu release, so moving ubuntu-latest
    # (24.04 to 26.04 in Nov 2026) left WebKit asking for libraries the new image doesn't have.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24" # current LTS for the browser tests; nothing in them needs it, the unit-test job above stays on 22
      - name: Install Playwright and the icon set the preview uses
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0 @mdi/js@7.4.47
          cp node_modules/@mdi/js/mdi.js scripts/preview/mdi.js
      - name: Cache the browser
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # The cached browser is built for one Ubuntu release. Keep the release in the key, and change it
          # with runs-on, so a runner move downloads a matching build instead of restoring one that can't load.
          key: playwright-1.63.0-ubuntu-24.04-${{ matrix.browser }}
      # The Ubuntu mirror often trickles the browsers' system packages until the job times out. Keep the .deb
      # files apt downloads in the cache, so a run installs them from disk and only fetches what Ubuntu has since
      # updated. The month in the key refreshes the set, and restore-keys starts each month from the last one.
      - name: Name the month for the apt package cache
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache the browser system packages
        uses: actions/cache@v6
        with:
          path: ~/apt-debs
          key: apt-debs-ubuntu-24.04-${{ matrix.browser }}-${{ steps.month.outputs.month }}
          restore-keys: apt-debs-ubuntu-24.04-${{ matrix.browser }}-
      - name: Make apt fail fast on a stalled mirror, and hand it the cached packages
        # Time out a stalled download and retry it instead of hanging, and keep what apt downloads so it can be
        # cached. A package already in /var/cache/apt/archives at the version apt wants is not downloaded again.
        run: |
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "3";\nAPT::Keep-Downloaded-Packages "true";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' | sudo tee /etc/apt/apt.conf.d/99ci-apt
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          mkdir -p ~/apt-debs
          if compgen -G "$HOME/apt-debs/*.deb" > /dev/null; then sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/; fi
          echo "apt: $(ls ~/apt-debs | wc -l) cached packages"
      - name: Install the browser
        if: steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install browser system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        timeout-minutes: 6
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Keep the downloaded packages for the cache
        # autoclean drops versions Ubuntu no longer serves, so the cached set doesn't grow month to month.
        run: |
          sudo apt-get autoclean -qq
          rm -f ~/apt-debs/*.deb
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          echo "$(ls ~/apt-debs | wc -l) packages to cache"
      - name: Serve the repository
        run: |
          python3 -m http.server 8766 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8766/scripts/preview/index.html > /dev/null && break; sleep 1; done
      - name: Edit layout, zoom and touch in ${{ matrix.browser }}
        timeout-minutes: 5
        run: |
          set +e
          # Stop a hung run before the step's own timeout, so its log and the annotation below still come out.
          BROWSER=${{ matrix.browser }} timeout -k 10 240 node scripts/preview/interact.js > interact.log 2>&1
          code=$?
          cat interact.log
          if [ $code -eq 124 ]; then echo "::error title=interact.js timed out::stopped after 240 s, see the end of the log above"; fi
          if [ $code -ne 0 ]; then
            # Put the end of the log in an annotation, which stays readable when the raw log is not at hand.
            echo "::error title=interact.js failed::$(grep -v "^\s*[-0-9]* *[×-] \(waiting\|element\|scrolling\|done\|retrying\)" interact.log | tail -n 40 | head -c 5000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          fi
          exit $code

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No real network addresses in code, tests or docs
        run: python3 scripts/check_examples.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the full history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner
