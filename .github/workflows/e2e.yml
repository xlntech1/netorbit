name: E2E

# Runs NetOrbit inside the real Home Assistant container and opens the card in Chromium and WebKit.
# The logic lives in scripts/ci/ha_e2e.py so it can be run by hand too (see the top of that file).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  home-assistant:
    name: Home Assistant ${{ matrix.ha }}
    # Pinned: Playwright downloads a WebKit build for the host's Ubuntu release, so moving ubuntu-latest
    # (24.04 to 26.04 in Nov 2026) left WebKit asking for libraries the new image doesn't have.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A broken beta shows up as a warning on the run without blocking anything.
    continue-on-error: ${{ matrix.ha == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        ha: [pinned, beta]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/ci/requirements_e2e.txt
      - run: pip install -r scripts/ci/requirements_e2e.txt

      - name: Pick the Home Assistant image
        id: image
        run: |
          # "pinned" is the release the unit tests run against (pytest-homeassistant-custom-component pins it).
          if [ "${{ matrix.ha }}" = pinned ]; then tag=$(python scripts/ci/ha_e2e.py pinned-version); else tag=beta; fi
          echo "Home Assistant image tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Start Home Assistant
        id: start
        run: |
          mkdir -p ha-config e2e-artifacts
          docker run -d --name ha-e2e -p 8123:8123 -e TZ=UTC \
            -v "$PWD/ha-config:/config" \
            -v "$PWD/custom_components/netorbit:/config/custom_components/netorbit:ro" \
            ghcr.io/home-assistant/home-assistant:${{ steps.image.outputs.tag }}

      # Home Assistant boots while the browsers install.
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # The cached browsers are built for one Ubuntu release. Keep the release in the key, and change it
          # with runs-on, so a runner move downloads matching builds instead of restoring ones that can't load.
          key: playwright-ubuntu-24.04-${{ hashFiles('scripts/ci/requirements_e2e.txt') }}
      # The Ubuntu mirror often trickles the browsers' system packages until the job times out. Keep the .deb
      # files apt downloads in the cache, so a run installs them from disk and only fetches what Ubuntu has since
      # updated. The month in the key refreshes the set, and restore-keys starts each month from the last one.
      - name: Name the month for the apt package cache
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache the browser system packages
        uses: actions/cache@v6
        with:
          path: ~/apt-debs
          key: apt-debs-ubuntu-24.04-chromium-webkit-${{ steps.month.outputs.month }}
          restore-keys: apt-debs-ubuntu-24.04-chromium-webkit-
      - name: Make apt fail fast on a stalled mirror, and hand it the cached packages
        # Time out a stalled download and retry it instead of hanging, and keep what apt downloads so it can be
        # cached. A package already in /var/cache/apt/archives at the version apt wants is not downloaded again.
        run: |
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "3";\nAPT::Keep-Downloaded-Packages "true";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' | sudo tee /etc/apt/apt.conf.d/99ci-apt
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          mkdir -p ~/apt-debs
          if compgen -G "$HOME/apt-debs/*.deb" > /dev/null; then sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/; fi
          echo "apt: $(ls ~/apt-debs | wc -l) cached packages"
      - name: Install Chromium and WebKit
        if: steps.browsers.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: python -m playwright install --with-deps chromium webkit
      - name: Install browser system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        timeout-minutes: 8
        run: python -m playwright install-deps chromium webkit
      - name: Keep the downloaded packages for the cache
        # autoclean drops versions Ubuntu no longer serves, so the cached set doesn't grow month to month.
        run: |
          sudo apt-get autoclean -qq
          rm -f ~/apt-debs/*.deb
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          echo "$(ls ~/apt-debs | wc -l) packages to cache"

      - name: Onboard, add NetOrbit and check the card in Chromium and WebKit
        run: python scripts/ci/ha_e2e.py run --url http://localhost:8123 --out e2e-artifacts

      - name: Check the Home Assistant log
        if: always() && steps.start.outcome == 'success'
        run: |
          docker logs ha-e2e > e2e-artifacts/docker.log 2>&1 || true
          cp ha-config/home-assistant.log e2e-artifacts/ 2>/dev/null || true
          python scripts/ci/ha_e2e.py check-log e2e-artifacts/home-assistant.log e2e-artifacts/docker.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-${{ matrix.ha }}
          path: e2e-artifacts/
          retention-days: 7
          if-no-files-found: warn
